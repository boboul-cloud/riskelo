name: Riskelo
options:
  bundleIdPrefix: com.oulhen
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
  # Le français est la langue d'origine : les clés du catalogue sont ses
  # phrases, et l'anglais en est la traduction. C'est aussi ce qui s'affiche
  # sur un appareil dont la langue n'est ni l'une ni l'autre — et les
  # questions suivent ce choix, pas celui du téléphone.
  developmentLanguage: fr

settings:
  base:
    # Xcode relève lui-même les chaînes du code et remplit le catalogue. Les
    # deviner à la main aurait mal tourné sur les phrases interpolées, dont la
    # clé n'est pas le texte écrit mais sa forme à spécificateurs.
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_VERSION: "5.0"
    # Le numéro qu'on lit sur l'App Store, et celui qui compte les envois.
    # Le premier ne bouge qu'à une vraie version ; le second monte à chaque
    # dépôt sur App Store Connect, qui refuse deux fois le même.
    MARKETING_VERSION: "1.4"
    CURRENT_PROJECT_VERSION: "8"
    # Posée ici et non dans Xcode : « xcodegen generate » réécrit le projet,
    # et une équipe renseignée à la main disparaîtrait à la régénération.
    DEVELOPMENT_TEAM: 38DQ8FW23J
    CODE_SIGN_STYLE: Automatic

targets:
  Riskelo:
    type: application
    # Une seule cible pour les trois machines : le plateau est dessiné en
    # coordonnées relatives, il n'a pas d'opinion sur la taille de l'écran.
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Sources
      # Les questions sont des ressources et non du code : mille lignes de
      # texte n'ont rien à faire dans un fichier Swift.
      - path: Resources/Localizable.xcstrings
      - path: Resources/Questions
      # Le faux App Store, visible dans Xcode pour qu'on puisse en changer les
      # prix — mais hors de toute phase de construction : il ne part pas dans
      # le paquet, et n'a rien à y faire.
      - path: Resources/Riskelo.storekit
        buildPhase: none
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Riskelo
        # Les deux numéros renvoient aux réglages plus haut plutôt que d'être
        # recopiés ici. XcodeGen réécrit ce plist, et ses valeurs par défaut
        # sont « 1.0 » et « 1 » : sans ces deux lignes, monter le build dans
        # les réglages ne changeait rien à ce que l'App Store recevait.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Aucun chiffrement propre : la déclaration est posée ici une fois
        # pour toutes plutôt que répondue à la main à chaque envoi.
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        # Un plateau se regarde dans les deux sens, sur les trois machines.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Le jeu à deux appareils passe par le réseau local. Sans ces deux
        # entrées, le système le refuse en silence : les appareils ne se
        # voient jamais et rien n'explique pourquoi.
        NSLocalNetworkUsageDescription: >-
          Riskelo s'en sert pour trouver l'autre appareil et jouer la partie à deux.
        NSBonjourServices:
          - _riskelo-jeu._tcp
          - _riskelo-jeu._udp
        # Le lien d'invitation, quand le système n'a pas fait le
        # rapprochement entre le site et l'application — ou quand
        # l'application vient d'être installée et que le rapprochement n'a
        # pas encore eu lieu. La page d'invitation porte un bouton qui passe
        # par là, et il marche toujours.
        CFBundleURLTypes:
          - CFBundleURLName: com.oulhen.riskelo.invitation
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes:
              - riskelo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oulhen.riskelo
        PRODUCT_NAME: Riskelo
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
        # L'icône est engendrée par « outils/icone.swift » — les onze images du
        # catalogue ne sont pas retouchées à la main, elles se refont.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        # Le bac à sable, pour le Mac seulement — iOS l'a déjà d'office, et
        # ces clés-là n'y ont pas cours. Sans ce fichier, le Mac App Store
        # refuse le dépôt ; avec lui mais sans ses deux clés de réseau, la
        # liaison entre appareils se tairait. Voir
        # soumission/FICHE-DE-SOUMISSION.md, section 9.
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: Resources/Riskelo-mac.entitlements
        # Sur iPhone et iPad, deux clés seulement : Game Center, et le domaine
        # d'où viennent les liens d'invitation. Le bac à sable n'y a pas cours
        # — le système le pose d'office.
        CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]: Resources/Riskelo-ios.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]: Resources/Riskelo-ios.entitlements

  RiskeloTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Tests
    dependencies:
      - target: Riskelo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oulhen.riskelo.tests
        GENERATE_INFOPLIST_FILE: YES
      # Une cible pour deux systèmes, mais un paquet d'application n'a pas la
      # même forme sur les deux : l'exécutable est à la racine sur iOS, dans
      # « Contents/MacOS » sur Mac. Le chemin engendré est celui d'iOS, et les
      # tests ne se lançaient donc jamais sur Mac — la seule machine où on
      # puisse les lancer sans simulateur.
      configs:
        Debug:
          TEST_HOST[sdk=macosx*]: "$(BUILT_PRODUCTS_DIR)/Riskelo.app/Contents/MacOS/Riskelo"
          BUNDLE_LOADER[sdk=macosx*]: "$(TEST_HOST)"
        Release:
          TEST_HOST[sdk=macosx*]: "$(BUILT_PRODUCTS_DIR)/Riskelo.app/Contents/MacOS/Riskelo"
          BUNDLE_LOADER[sdk=macosx*]: "$(TEST_HOST)"

schemes:
  Riskelo:
    build:
      targets:
        Riskelo: all
        RiskeloTests: [test]
    # L'App Store de bureau, attaché au schéma : on essaie les achats sans rien
    # créer chez Apple, et rien n'est facturé.
    #
    # Le chemin est compté depuis « Riskelo.xcodeproj/xcshareddata », et non
    # depuis le dossier des schémas : deux niveaux au-dessus, et l'on est à la
    # racine du projet. XcodeGen ajoute ces deux niveaux lui-même, il ne faut
    # donc rien mettre devant.
    #
    # Un « ../ » de trop et Xcode cherche le fichier sur le Bureau, un cran
    # au-dessus du projet — c'est ce qu'il disait mot pour mot.
    run:
      storeKitConfiguration: Resources/Riskelo.storekit
    test:
      targets: [RiskeloTests]
